name: Spring Boot & Gradle CD

# dev branch에 push가 발생할 경우 동작
on:
  push:
    branches: [ dev ]

jobs:
  build:
    # 실행 환경 지정
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: 17

      - name: make application.yml
        run: |
          ## create application.yml
          mkdir ./src/main/resources
          cd ./src/main/resources
          # application.yml 파일 생성
          touch ./application.yml
          # GitHub-Actions 에서 설정한 값을 application.yaml 파일에 쓰기
          echo "${{ secrets.APPLICATION_DEV }}" >> ./application.yml
        shell: bash

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Build
      - name: Build with Gradle
        run: ./gradlew clean build -x test

      ## 웹 이미지 빌드 및 도커허브에 push
      - name: web docker build and push
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -t ${{ secrets.DOCKER_REPO }}/${{ secrets.DOCKER_IMAGE_DEV }} .
          docker push ${{ secrets.DOCKER_REPO }}/${{ secrets.DOCKER_IMAGE_DEV }}
      ## docker compose up
      - name: executing remote ssh commands using password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST_ID }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            sudo docker compose -f ${{ secrets.DOCKER_COMPOSE_DEV }} -p dev down
            sudo docker pull ${{ secrets.DOCKER_REPO }}/${{ secrets.DOCKER_IMAGE_DEV }}
            sudo docker compose -f ${{ secrets.DOCKER_COMPOSE_DEV }} up -p dev -d
            sudo docker image prune -f