global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'drinkig-prod'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['drinkig_prod:8080']
        labels:
          env: prod

  - job_name: 'drinkig-dev'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['drinkig_dev:8081']
        labels:
          env: dev

  - job_name: 'drinkig-local'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          env: local